# Staticcheck configuration for unused code detection
checks = ["all", "-ST1000", "-ST1003"]

# Enable unused code detection (U1000 series)
[checks.U1000]
enabled = true

# Exclude patterns
[exclude]
# Exclude generated code
generated = [".*\\.pb\\.go", ".*_gen\\.go", ".*/sqlc/.*"]

# Exclude test helpers (analyzed separately)
tests = false
