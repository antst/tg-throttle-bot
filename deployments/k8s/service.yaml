apiVersion: v1
kind: Service
metadata:
  name: throttlebot
  labels:
    app: throttlebot
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: health
    protocol: TCP
    name: health
  selector:
    app: throttlebot
apiVersion: v1
kind: ConfigMap
metadata:
  name: throttlebot-config
data:
  log-level: "info"
  default-char-limit: "1000"
  default-window: "1h"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: throttlebot-migrations
data:
  # Migrations will be populated from the migrations directory
  # In production, consider using a ConfigMap generator or embedding migrations in the image

