apiVersion: v1
kind: Secret
metadata:
  name: throttlebot-secrets
type: Opaque
stringData:
  # Replace these values with your actual credentials
  # In production, use sealed secrets, external secrets operator, or vault
  telegram-token: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
  database-url: "postgres://username:password@postgres-host:5432/throttlebot?sslmode=require"

